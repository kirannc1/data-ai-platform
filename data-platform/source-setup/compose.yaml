services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro

volumes:
  postgres-data: