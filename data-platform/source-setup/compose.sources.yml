services:
  minio:
    image: reconciliation-minio:2025-10-15
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: reconciliation
      MINIO_ROOT_PASSWORD: reconciliation-local-demo # from secret manager
    volumes:
      - minio-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  minio-data:
  redpanda-data: