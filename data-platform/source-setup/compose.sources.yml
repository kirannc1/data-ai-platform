services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: demo-storage
      MINIO_ROOT_PASSWORD: demo-storage-local
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  minio-data:
  redpanda-data: