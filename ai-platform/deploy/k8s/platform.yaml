apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform
  namespace: enterprise-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-platform
  template:
    metadata:
      labels:
        app: ai-platform
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: enterprise-ai-platform:0.2.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: finance-gold-reader
          env:
            - name: MINIO_ENDPOINT
              value: "http://192.168.29.250:9000"
            - name: GOLD_BUCKET
              value: "gold"
            - name: DEMO_RUN_ID
              value: "silver-demo-001"
            - name: GOLD_SOURCE_INSTANCE
              value: "http://192.168.29.250:8080"
            - name: SPARK_LOCAL_IP
              value: "127.0.0.1"
            - name: SPARK_LOCAL_HOSTNAME
              value: "localhost"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-platform
  namespace: enterprise-ai
spec:
  selector:
    app: ai-platform
  ports:
    - port: 8000
      targetPort: http
