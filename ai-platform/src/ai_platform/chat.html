<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Reconciliation Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f2f5f8;
      color: #142437;
      font: 16px/1.5 "Inter", system-ui, sans-serif;
    }

    main {
      max-width: 52rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-right: auto;
    }

    select,
    textarea,
    button {
      font: inherit;
    }

    select,
    textarea {
      padding: .65rem;
      border: 1px solid #64748b;
      border-radius: .5rem;
      background: white;
      color: inherit;
    }

    #conversation {
      height: clamp(16rem, 50vh, 34rem);
      overflow-y: auto;
      padding: 1rem;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: .75rem;
    }

    .message {
      width: fit-content;
      max-width: 90%;
      margin: 0 0 .75rem;
      padding: .65rem .9rem;
      background: #eef2f6;
      border-radius: .65rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin-left: auto;
      background: #dbeafe;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    form {
      display: grid;
      gap: .5rem;
      margin-top: 1rem;
    }

    textarea {
      width: 100%;
      resize: vertical;
    }

    button {
      justify-self: end;
      padding: .55rem 1.25rem;
      border: 0;
      border-radius: .5rem;
      background: #1e40af;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    body {
      background: #edf2f7;
      color: #172a3d;
    }

    main {
      max-width: 62rem;
      margin: clamp(1rem, 5vh, 3.5rem) auto;
    }

    .workspace-header {
      display: flex;
      justify-content: space-between;
      gap: 1.25rem;
      padding: clamp(1rem, 4vw, 2rem);
      border-radius: 1rem 1rem 0 0;
      color: #f8fafc;
      background: radial-gradient(ellipse at top right, #1c5367, #102436 65%);
    }

    .workspace-title {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .workspace-label {
      margin: 0;
      color: #a8d8df;
      font-size: .875rem;
    }

    .workspace-header h1 {
      margin: .15rem 0 0;
      font-size: clamp(1.25rem, 4vw, 2rem);
    }

    .ledger-mark {
      display: grid;
      align-content: center;
      gap: .3rem;
      flex: 0 0 3rem;
      height: 3rem;
      padding: .65rem;
      border: 1px solid #6b9ca9;
      border-radius: .75rem;
      background: #ffffff12;
    }

    .ledger-mark span {
      height: .2rem;
      border-radius: 1rem;
      background: #99e6d4;
    }

    .ledger-mark span:nth-child(2) {
      width: 70%;
    }

    .ledger-mark span:nth-child(3) {
      width: 85%;
    }

    .company-field {
      display: grid;
      gap: .25rem;
    }

    .company-field label {
      font-size: .875rem;
    }

    #conversation {
      height: clamp(18rem, 48vh, 32rem);
      padding: clamp(1rem, 4vw, 2rem);
      border-radius: 0;
      border-top: 0;
    }

    .chat-start {
      margin-bottom: 1.5rem;
      padding: 1rem 1.25rem;
      border-left: 3px solid #147d75;
      border-radius: .5rem;
      background: #eef7f6;
    }

    .chat-start h2 {
      margin: 0;
      font-size: 1.125rem;
    }

    .chat-start p {
      margin: .35rem 0 .75rem;
    }

    .example-question {
      border: 1px solid #85afa9;
      background: #fff;
      color: #174d48;
      text-align: left;
    }

    .chat-start[hidden] {
      display: none;
    }

    form {
      margin-top: 0;
      padding: 1rem;
      border: 1px solid #cbd5e1;
      border-top: 0;
      border-radius: 0 0 1rem 1rem;
      background: #fff;
    }

    .message.user {
      background: #d9eeff;
    }

    #send {
      background: #145c57;
    }

    .explanation-details {
      margin: -.25rem 0 1rem;
      padding: .65rem .9rem;
      border: 1px solid #cbd5e1;
      border-radius: .5rem;
      background: #f8fafc;
      overflow-wrap: anywhere;
    }

    .explanation-details summary {
      cursor: pointer;
      font-weight: 600;
    }

    .explanation-details p {
      margin: .5rem 0;
      white-space: pre-wrap;
    }

    :focus-visible {
      outline: 3px solid #16877d;
      outline-offset: 3px;
    }

    @media (max-width: 40rem) {

      .company-field,
      .company-field select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="workspace-header">
      <div class="workspace-title">
        <div class="ledger-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div>
          <p class="workspace-label">Finance workspace</p>
          <h1>Reconciliation Chat</h1>
        </div>
      </div>

      <div class="company-field">
        <label for="company">Company</label>
        <select id="company" required disabled></select>
      </div>
    </header>

    <section id="conversation" role="log" aria-label="Conversation">
      <div class="chat-start">
        <h2>Review a GL entry</h2>
        <p>Ask about its reconciliation status or statement candidates.</p>
        <button type="button" id="example-question" class="example-question">
          Why is ACC-GLE-2026-00002 ambiguous?
        </button>
      </div>
    </section>

    <form id="chat-form">
      <label for="question">Question</label>
      <textarea id="question" rows="3" maxlength="2000" required
        placeholder="Why is ACC-GLE-2026-00002 ambiguous?"></textarea>
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </main>

  <script>
    const company = document.querySelector("#company");
    const conversation = document.querySelector("#conversation");
    const form = document.querySelector("#chat-form");
    const question = document.querySelector("#question");
    const send = document.querySelector("#send");

    function addMessage(kind, text) {
      const message = document.createElement("p");
      message.className = `message ${kind}`;
      message.textContent = text;
      conversation.append(message);
      conversation.scrollTop = conversation.scrollHeight;
      return message;
    }

    document.querySelector("#example-question").addEventListener("click", () => {
      question.value = "Why is ACC-GLE-2026-00002 ambiguous?";
      question.focus();
    });

    async function loadCompanies() {
      try {
        const response = await fetch("/v1/finance/chat/companies");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const { companies } = await response.json();
        if (!Array.isArray(companies)) throw new Error("Invalid company response");
        if (!companies.length) {
          addMessage("error", "No companies are available for this chat.");
          return;
        }
        for (const name of companies) {
          company.add(new Option(name, name));
        }
        company.disabled = false;
        send.disabled = false;
      } catch (error) {
        addMessage("error", `Couldn't load companies (${error.message}).`);
      }
    }

    function appendExplanationDetails(reply, body) {
      const evidence = body.evidence;
      const citations = body.citations ?? [];
      if (!evidence && citations.length === 0) return;

      const details = document.createElement("details");
      details.className = "explanation-details";

      const summary = document.createElement("summary");
      summary.textContent = "Supporting records and policy";
      details.append(summary);

      function addLine(text) {
        const line = document.createElement("p");
        line.textContent = text;
        details.append(line);
      }

      if (evidence) {
        addLine(`Gold run ${evidence.run_id} · ${evidence.gl_id} · ${evidence.status}`);

        const candidates = evidence.statement_candidate_ids ?? [];
        addLine(candidates.length
          ? `Statement candidates: ${candidates.join(", ")}`
          : "No eligible statement candidates.");

        for (const candidate of evidence.shared_statement_candidates ?? []) {
          const ids = candidate.claimant_gl_ids ?? [];
          const shown = ids.length < candidate.claimant_count
            ? ` (showing ${ids.length})`
            : "";
          addLine(
            `${candidate.transaction_id} · ${candidate.claimant_count} GL claimants${shown}`
          );
          if (ids.length) addLine(ids.join(", "));
        }
      }

      for (const citation of citations) {
        addLine(`${citation.document_id} v${citation.version} · ${citation.section}`);
        addLine(citation.excerpt);
      }

      reply.after(details);
      conversation.scrollTop = conversation.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = question.value.trim();
      if (!message || !company.value || send.disabled) return;
      document.querySelector(".chat-start").hidden = true;

      const selectedCompany = company.value;
      addMessage("user", `${selectedCompany}\n${message}`);
      question.value = "";
      send.disabled = true;
      company.disabled = true;
      send.textContent = "Sending…";
      const pending = addMessage("assistant", "Looking up the reconciliation result…");

      try {
        const response = await fetch("/v1/finance/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ company: selectedCompany, message }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(typeof body.detail === "string"
            ? body.detail : `HTTP ${response.status}`);
        }
        if (typeof body.reply !== "string" || !body.reply.trim()) {
          throw new Error("The server returned an empty reply.");
        }
        const reply = addMessage("assistant", body.reply);
        appendExplanationDetails(reply, body);
      } catch (error) {
        addMessage("error", `Couldn't complete the request. ${error.message}`);
        if (!question.value) question.value = message;
      } finally {
        pending.remove();
        send.disabled = false;
        company.disabled = false;
        send.textContent = "Send";
        question.focus();
      }
    });

    loadCompanies();
  </script>
</body>

</html>
